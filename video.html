<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>播放中...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
  }
  video {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #000;
  }
  /* 点击提示层 */
  .tap-layer {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 16px;
    z-index: 999;
    flex-direction: column;
    gap: 16px;
  }
  .tap-layer.show { display: flex; }
  .tap-layer .icon {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }
</style>
</head>
<body>

  <video id="myVideo"
         src="video.mp4"
         playsinline
         webkit-playsinline
         preload="auto"
         controls
         autoplay
         muted></video>

  <div class="tap-layer" id="tapLayer">
    <div class="icon">▶</div>
    <div>点击屏幕播放</div>
  </div>

<script>
  var video = document.getElementById('myVideo');
  var tapLayer = document.getElementById('tapLayer');

  // 尝试播放：先带声音，不行就静音
  function tryPlay() {
    video.muted = false;
    var p = video.play();
    if (p && p.catch) {
      p.then(function() {
        // 成功，隐藏提示
        tapLayer.classList.remove('show');
      }).catch(function() {
        // 带声音失败，尝试静音播放
        video.muted = true;
        var p2 = video.play();
        if (p2 && p2.catch) {
          p2.then(function() {
            // 静音播放成功，隐藏提示
            tapLayer.classList.remove('show');
          }).catch(function() {
            // 都失败，显示点击提示
            tapLayer.classList.add('show');
          });
        } else {
          tapLayer.classList.add('show');
        }
      });
    } else {
      tapLayer.classList.add('show');
    }
  }

  // 视频开始播放后隐藏提示
  video.addEventListener('playing', function() {
    tapLayer.classList.remove('show');
  });

  // 页面加载后尝试播放
  window.addEventListener('load', function() {
    tryPlay();
  });

  // 点击提示层：开声音 + 播放
  tapLayer.addEventListener('click', function() {
    video.muted = false;
    video.play().catch(function(){});
    tapLayer.classList.remove('show');
  });

  // 点击视频本身：暂停时播放，静音时开声音
  video.addEventListener('click', function() {
    if (video.paused) {
      video.muted = false;
      video.play().catch(function(){});
    } else if (video.muted) {
      video.muted = false;
    }
  });
</script>

</body>
</html>
