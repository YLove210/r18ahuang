<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>播放中...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
  }
  video {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    object-fit: contain;
    background: #000;
  }
  .tap-layer {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.75);
    color: #fff; font-size: 16px;
    z-index: 999;
    flex-direction: column;
    gap: 16px;
  }
  .tap-layer.show { display: flex; }
  .tap-layer .icon {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
  }
</style>
</head>
<body>

  <video id="myVideo"
         src="video.mp4"
         playsinline
         webkit-playsinline
         preload="auto"
         controls
         autoplay
         muted></video>

  <div class="tap-layer" id="tapLayer">
    <div class="icon">▶</div>
    <div>点击屏幕开始播放</div>
  </div>

<script>
  var video = document.getElementById('myVideo');
  var tapLayer = document.getElementById('tapLayer');

  // 尝试自动播放：先带声音，失败就静音
  function tryPlay() {
    video.muted = false;
    var p = video.play();
    if (p && p.catch) {
      p.then(function() {
        tapLayer.classList.remove('show');
        tryFullscreen();
      }).catch(function() {
        video.muted = true;
        var p2 = video.play();
        if (p2 && p2.catch) {
          p2.then(function() {
            tapLayer.classList.remove('show');
            tryFullscreen();
          }).catch(function() {
            tapLayer.classList.add('show');
          });
        } else {
          tapLayer.classList.add('show');
        }
      });
    } else {
      tapLayer.classList.add('show');
    }
  }

  // 尝试全屏 + 锁横屏
  function tryFullscreen() {
    var el = video;
    try {
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.webkitEnterFullscreen) el.webkitEnterFullscreen(); // iOS Safari 专用
    } catch(e) {}
    // 尝试锁横屏（安卓部分浏览器支持，iOS 不支持也不报错）
    try {
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(function(){});
      }
    } catch(e) {}
  }

  video.addEventListener('playing', function() {
    tapLayer.classList.remove('show');
  });

  window.addEventListener('load', tryPlay);

  // 点提示层：开声音 + 播放 + 全屏
  tapLayer.addEventListener('click', function() {
    video.muted = false;
    video.play().catch(function(){});
    tapLayer.classList.remove('show');
    tryFullscreen();
  });

  // 点视频本身也尝试开声音
  video.addEventListener('click', function() {
    if (video.paused) {
      video.muted = false;
      video.play().catch(function(){});
      tryFullscreen();
    } else if (video.muted) {
      video.muted = false;
    }
  });
</script>

</body>
</html>
